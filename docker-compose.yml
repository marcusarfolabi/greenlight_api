services:
  postgres:
    image: postgres:15-alpine
    container_name: greenlight_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenlight_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  greenlight_api:
    build: ./
    container_name: greenlight_api
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/greenlight_db
      PORT: 8000 
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - .:/app
      - ./cache:/app/cache
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: