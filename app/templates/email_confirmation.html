<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;        background-color: #ffffff;
        color: #171717;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 450px;
        margin: 0 auto;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 40px;
      }
      .logo {
        font-weight: 700;
        font-size: 24px;
        letter-spacing: -0.05em;
        margin-bottom: 30px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .text {
        font-size: 14px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 30px;
      }
      .otp-container {
        background-color: #f9f9f9;
        border-radius: 6px;
        padding: 16px;
        text-align: center;
        margin-bottom: 30px;
        border: 1px solid #efefef;
      }
      .otp-code {
        font-family: monospace;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #000;
      }
      .footer {
        font-size: 12px;
        color: #a1a1a1;
        border-top: 1px solid #eaeaea;
        padding-top: 20px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="margin-bottom: 30px; text-align: center">
        <img
          src="https://falconkonnects.com/falconmail_logo_.png"
          alt="FalconKonnects"
          style="display: block; width: 180px; height: auto; margin: 0 auto"
        />
      </div>
      <div class="title">Verify your email address</div>
      <p class="text">
        To finish logging in to your account, please enter the following
        verification code:
      </p>

      <div class="otp-container">
        <span class="otp-code">{{ otp_code }}</span>
      </div>

      <p class="text">
        This code will expire in 15 minutes. If you did not request this, you
        can safely ignore this email.
      </p>

      <div class="footer">
            &copy;
            <script>document.write(new Date().getFullYear())</script>
            FalconKonnect. Built for sovereignty.
        </div>
    </div>
  </body>
</html>
