<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family:
          "Instrument Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #ffffff;
        color: #171717;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 520px;
        margin: 0 auto;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 32px;
      }
      .logo {
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .text {
        font-size: 14px;
        line-height: 1.6;
        color: #666;
        margin-bottom: 20px;
      }
      .code-container {
        background-color: #f9f9f9;
        border-radius: 6px;
        padding: 14px;
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid #efefef;
      }
      .access-code {
        font-family: monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #000;
      }
      .footer {
        font-size: 12px;
        color: #a1a1a1;
        border-top: 1px solid #eaeaea;
        padding-top: 18px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="margin-bottom: 20px; text-align: center">
        <img
          src="https://greenlightquiz.com/og-image.jpg"
          alt="GreenLight Logo"
          style="display: block; width: 160px; height: auto; margin: 0 auto"
        />
      </div>

      <div class="title">Your access code for {{ arena_name }}</div>

      <p class="text">Hi {{ name }},</p>

      <p class="text">
        {{ body }}</strong>.
      </p>

      <p class="text" style="color: #666; font-size: 14px">
        If you did not expect this message, you can ignore it.
      </p>

      <p class="text">Good luck — see you in the arena!</p>

      <!-- the org name here below bold -->
        {% if org_name %}
          <p class="text" style="font-weight: 600; color: #333">{{ org_name }}</p>
        {% endif %}


          <p class="text">
        Ready to start? <br />
        <strong>The GreenLight Customer Care Team</strong>
      </p>

      <div
        class="footer"
        style="margin-top: 28px; font-size: 12px; color: #999"
      >
        &copy; 2026 Green Light Quiz. Built for you.
      </div>
    </div>
  </body>
</html>
